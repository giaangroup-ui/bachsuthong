CH.forEach((c,i)=>{KW[c[0]]=(KW[c[0]]||[]).concat(["vi","en","zh"].map(l=>nm(I18N[l].ch[i])))});
const STW=new Set(nm("xem nghe mo kenh tin tuc ve cho toi minh muon biet chuyen gi doc pi oi nhe nha di voi cua hom nay please open show me the news about channel i want to watch listen 看 打开 频道 新闻 我想 关于 的").split(" "));
function parse(q){const n=" "+nm(q)+" ";if(!n.trim())return null;let best=null,bl=0,bk="";
 for(const[c,ks]of Object.entries(KW))for(const k of ks){if(!k)continue;const hit=/^[\x00-\x7f]+$/.test(k)?n.includes(" "+k+" "):n.includes(k);if(hit&&k.length>bl){best=c;bl=k.length;bk=k}}
 for(const[c,S]of Object.entries(SUBS))for(const s of S)for(const l of["vi","en","zh"]){const k=nm(I18N[l].subs[s]);if(k.length>3&&n.includes(k)&&k.length>=bl)return{ch:c,sub:s}}
 const rest=n.trim().split(" ").filter(w=>w&&!STW.has(w)).join(" ");
 if(best&&(!rest||rest==bk||rest.length<=bl+1))return{ch:best};
 if(rest&&D){const ws=rest.split(" ").filter(w=>w.length>1||/[^\x00-\x7f]/.test(w));const H=D.items.filter(x=>{const t=nm(x.title+" "+x.summary);return ws.every(w=>t.includes(w))});if(H.length)return{q:rest,raw:q.trim()}}
 return best?{ch:best}:null}

let gk="";function show(){stopMic();$("pifab").hidden=true;$("pitip").hidden=true;chips();$("piin").placeholder=u().ph;$("piov").hidden=false;

 if(!items().some(x=>(AUD[x.id]||{})[MC]))msg=L_().noaud;
 $("pimsg").textContent=msg;idx=0;RADIO=false;document.body.classList.remove("radio");startTv();

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
function stopMic(){if(rec){try{rec.abort()}catch(e){}rec=null}$("pimic").classList.remove("on")}

<script>/* Tự động cập nhật phiên bản mới (version.json) */
(()=>{const CUR=(document.querySelector('meta[name="app-version"]')||{}).content||"dev";window.APP_VERSION=CUR;
const T={vi:["Có bản mới","Cập nhật"],en:["New version available","Update"],zh:["有新版本","更新"]};
try{const u=new URL(location.href);if(u.searchParams.has("v")){u.searchParams.delete("v");history.replaceState(history.state,"",u.pathname+u.search+u.hash)}}catch(e){}
let pending=null;
const st=()=>{try{return window.AU_STATE?AU_STATE():"idle"}catch(e){return"idle"}};
const lang=()=>{try{const l=(window.AU_LANG?AU_LANG():document.documentElement.lang||"vi").slice(0,2);return T[l]?l:"vi"}catch(e){return"vi"}};
function apply(){if(!pending)return;try{window.AU_BEFORE&&AU_BEFORE()}catch(e){}sessionStorage.auTried=pending;const u=new URL(location.href);u.searchParams.set("v",pending);location.replace(u.toString())}
function toast(){let d=document.getElementById("auT");const t=T[lang()];if(!d){d=document.createElement("div");d.id="auT";d.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom));z-index:2147483000;background:#111a;backdrop-filter:blur(6px);color:#fff;border:1px solid #fff3;border-radius:999px;padding:8px 8px 8px 16px;display:flex;gap:10px;align-items:center;font:600 14px system-ui,sans-serif;box-shadow:0 6px 24px #0008";
 d.innerHTML='<span></span><button style="background:#ffc800;color:#000;border:0;border-radius:999px;padding:7px 14px;font-weight:700;cursor:pointer"></button>';d.querySelector("button").onclick=()=>{if(st()=="busy"){d.querySelector("span").textContent="⏳ "+t[0]}else apply()};document.body.appendChild(d)}
 d.querySelector("span").textContent="🔄 "+t[0];d.querySelector("button").textContent=t[1]}
window.AU_TRY=()=>{if(!pending)return false;const s=st();if(s=="idle"){apply();return true}if(s=="work")toast();return false};
window.AU_PENDING=()=>!!pending;
async function check(){try{const r=await fetch("version.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)return;const j=await r.json();
 if(!j.v||j.v===CUR||CUR==="dev"||CUR.startsWith("__"))return;
 if(sessionStorage.auTried===j.v&&!pending){pending=null;return}/* tránh vòng lặp nếu CDN còn trả bản cũ */
 if(pending!==j.v){pending=j.v;if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js?v="+j.v,{scope:"./"}).catch(()=>{})}
 AU_TRY()}catch(e){}}
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js?v="+CUR,{scope:"./"}).catch(()=>{}));
setTimeout(check,2500);setInterval(check,5*60*1000);setInterval(()=>{if(pending)AU_TRY()},3000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")check()});addEventListener("focus",check);addEventListener("online",check);
})();</script>
