# Sao chép file này vào .github/workflows/update.yml (trên GitHub: Add file → Create new file)
name: Cập nhật tin
on:
  schedule: [{cron: "*/30 * * * *"}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: news, cancel-in-progress: false}
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/fetch.py
      - run: |
          git config user.name "bst-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/news.json
          git diff --cached --quiet || (git commit -m "Cập nhật tin" && git pull --rebase && git push)
